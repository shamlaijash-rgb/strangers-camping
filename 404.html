<!-- Self-contained on purpose: no external CSS, so it renders even if the stylesheet path breaks -->
<style>
  :root{ --ink:#0E2A1C; --cream:#FFF8EC; --amber:#F7B733; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100dvh; display:grid; place-items:center; text-align:center; padding:2rem;
    background:radial-gradient(90% 70% at 50% 0%, #123322 0%, var(--ink) 55%, #081b11 100%);
    color:var(--cream);
    font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  img{ width:132px; margin:0 auto 1.2rem; display:block; }
  h1{
    font-family:'Anton', 'Arial Narrow', Impact, system-ui, sans-serif; font-weight:400;
    text-transform:uppercase; letter-spacing:.01em; line-height:.95;
    font-size:clamp(2.3rem,9vw,4.6rem); margin:0 0 .5rem;
  }
  h1 span{ color:var(--amber); }
  p{ color:rgba(255,248,236,.75); max-width:44ch; margin:0 auto 1.6rem; line-height:1.65; }
  a.btn{
    display:inline-flex; align-items:center; gap:.6rem; padding:1rem 1.8rem; border-radius:999px;
    background:var(--amber); color:var(--ink); font-weight:700; text-decoration:none;
    box-shadow:0 18px 34px -14px rgba(232,137,28,.95); transition:transform .22s;
  }
  a.btn:hover{ transform:translateY(-2px); }
  .alt{ display:block; margin-top:1.2rem; font-size:.85rem; color:rgba(255,248,236,.55); }
  .alt a{ color:var(--amber); }
</style>
</head>
